services:
  - type: web
    name: leadrescue
    runtime: node
    plan: starter
    buildCommand: "echo 'zero dependencies — nothing to build'"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_PATH
        value: /data/leadrescue.db
      - key: SECURE_COOKIES
        value: "true"
      - key: ENGINE_INTERVAL_MS
        value: "60000"
    disk:
      name: leadrescue-data
      mountPath: /data
      sizeGB: 1
