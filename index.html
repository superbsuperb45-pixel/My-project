<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LeadRescue — Workspace</title>
  <meta name="description" content="LeadRescue workspace: lead recovery, follow-ups and analytics for your business." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/app/styles.css" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <meta name="theme-color" content="#0e1726" />
</head>
<body class="app-body">
  <div id="boot" class="boot">
    <div class="boot-inner">
      <span class="brand-mark lg" aria-hidden="true">LR</span>
      <p>Loading your workspace…</p>
    </div>
  </div>
  <div id="app" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:24px">LeadRescue needs JavaScript enabled to run the workspace.</p></noscript>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
